name: Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- scoped to main branch, checks conclusion
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate version
        id: version
        run: |
          CALVER=$(date -u +"%Y-%m-%d")
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${CALVER}+${SHORT_SHA}" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # musl links statically, so the binary doesn't depend on the runner's glibc.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          rustup target add "${TARGET}"
          RAMEKIN_VERSION="${NEEDS_VERSION_OUTPUTS_VERSION}" cargo build --release --target "${TARGET}"
          tar -czf "ramekin-${TARGET}.tar.gz" -C "target/${TARGET}/release" ramekin
        env:
          TARGET: ${{ matrix.target }}
          NEEDS_VERSION_OUTPUTS_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ramekin-${{ matrix.target }}
          path: ramekin-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ramekin-*
          merge-multiple: true

      - name: Publish
        run: |
          VERSION="${NEEDS_VERSION_OUTPUTS_VERSION}"
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            ramekin-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_VERSION_OUTPUTS_VERSION: ${{ needs.version.outputs.version }}

  dotslash:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the DotSlash file to the release.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Generate DotSlash file
        uses: facebook/dotslash-publish-release@2539c4d8ae00a42773306c8731d2dd3724d979d2 # v1
        with:
          config: .github/dotslash-config.json
          tag: v${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
